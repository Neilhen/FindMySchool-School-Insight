<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ireland Schools Map</title>
  <meta name="theme-color" content="#f8f9fa">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  
  <!-- MarkerCluster CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="ui-container">
  <div class="panel">
    <div class="title-main">Ireland Schools</div>
    <div class="title-sub">Find schools in your area</div>
  </div>

  <div class="panel" id="search-box">
    <input type="text" id="search-input" placeholder="Search for a school...">
    <ul id="search-results"></ul>
  </div>


  <div class="panel" id="pin-box">
    <span class="filter-label">📍 Check an address</span>
    <div style="display:flex; gap:6px; margin-top:4px;">
      <input type="text" id="pin-input" placeholder="Address or Eircode..."
             style="flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-size:13px; outline:none;">
      <button id="pin-go" class="filter-btn" style="border:1px solid #1a237e; background:#1a237e; color:#fff;">Find</button>
    </div>
    <div style="display:flex; gap:6px; margin-top:6px;">
      <button id="pin-drop" class="filter-btn" style="border:1px solid #666;">Drop pin on map</button>
      <button id="pin-clear" class="filter-btn" style="border:1px solid #999; display:none;">Clear pin</button>
    </div>
    <div id="pin-status" style="font-size:11px; color:#777; margin-top:5px;"></div>
    <div id="pin-results" style="max-height:290px; overflow-y:auto; margin-top:6px; font-size:12px;"></div>
  </div>

  <div class="panel">
    <div class="collapsible-header" id="filters-header">
      <span>Filters & Layers</span>
      <span id="filters-icon">▼</span>
    </div>
    <div class="collapsible-content" id="filters-content">
      
      <div class="filter-group">
        <span class="filter-label">Level</span>
        <div class="filter-btns">
          <button class="filter-btn" id="f-preschool" onclick="toggleFilter('preschool')">Pre-school</button>
          <button class="filter-btn" id="f-primary" onclick="toggleFilter('primary')">Primary</button>
          <button class="filter-btn" id="f-secondary" onclick="toggleFilter('secondary')">Secondary</button>
          <button class="filter-btn" id="f-special" onclick="toggleFilter('special')">Special</button>
        </div>
      </div>
      
      <div class="filter-group">
        <span class="filter-label">Gender</span>
        <div class="filter-btns">
          <button class="filter-btn" id="f-boys" onclick="toggleFilter('boys')">Boys</button>
          <button class="filter-btn" id="f-girls" onclick="toggleFilter('girls')">Girls</button>
          <button class="filter-btn" id="f-coed" onclick="toggleFilter('coed')">Co-ed</button>
        </div>
      </div>
      
      <div class="filter-group">
        <span class="filter-label">Fees</span>
        <div class="filter-btns">
          <button class="filter-btn" id="f-feepaying" onclick="toggleFilter('feepaying')">Fee-paying</button>
          <button class="filter-btn" id="f-free" onclick="toggleFilter('free')">Free</button>
        </div>
      </div>
      
      <div class="filter-group">
        <span class="filter-label">Special</span>
        <div class="filter-btns">
          <button class="filter-btn" id="f-irish" onclick="toggleFilter('irish')">★ Irish-medium</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="sidebar">
  <div id="sidebar-header">
    <div style="flex:1">
      <div class="sb-name" id="sb-name">School Name</div>
      <div class="sb-badges" id="sb-badges"></div>
    </div>
    <button id="close-sidebar">✕</button>
  </div>
  <div id="sidebar-content">
    <div class="sb-section">
      <div class="sb-section-title">Tuition / Status</div>
      <div id="sb-fee" class="sb-fee-val">Free</div>
    </div>
    <div class="sb-section">
      <div class="sb-section-title">Location</div>
      <div id="sb-location" class="sb-text">Location</div>
    </div>
    <div class="sb-section">
      <div class="sb-section-title">Notes</div>
      <div id="sb-notes" class="sb-text">Notes</div>
    </div>
    <div class="sb-section" id="sb-feeder-section" style="display:none;">
      <div class="sb-section-title" id="sb-feeder-title">Feeder Schools</div>
      <ul class="feeder-list" id="sb-feeder-list"></ul>
    </div>
    <div class="sb-section" id="sb-admissions-section" style="display:none;">
      <div class="sb-section-title">🎟 Admissions (published policy)</div>
      <div id="sb-admissions" class="sb-text"></div>
    </div>
    <div class="sb-section" id="sb-links-section">
      <div class="sb-section-title">📎 Resources</div>
      <ul class="resource-list" id="sb-links-list"></ul>
    </div>
  </div>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
